<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Nexus Bridge</title>
  <style>
    :root {
      --bg: #0a0f1e;
      --panel: #111827;
      --text: #e2e8f0;
      --muted: #64748b;
      --accent: #3b82f6;
      --success: #10b981;
      --error: #ef4444;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      width: 320px;
      background: var(--bg);
      color: var(--text);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .header-icon { font-size: 1.4rem; }
    .header-title { font-size: 0.95rem; font-weight: 700; color: var(--accent); }
    .header-ver { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      font-size: 0.82rem;
      border-bottom: 1px solid var(--border);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .dot.green { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .dot.red   { background: var(--error);   box-shadow: 0 0 6px var(--error); }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .info-cell {
      background: var(--panel);
      padding: 10px 14px;
    }
    .info-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 3px; }
    .info-value { font-size: 0.85rem; font-weight: 600; }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px 16px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 9px 14px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      text-align: center;
      transition: opacity 0.15s;
      text-decoration: none;
      color: #fff;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); }
    .btn-success { background: var(--success); }
    .btn-muted   { background: transparent; color: var(--muted); border: 1px solid var(--border); }

    .footer {
      padding: 8px 16px;
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🤖</span>
    <div>
      <div class="header-title">Nexus Ertugrul Bridge</div>
      <div class="header-ver">v1.2.0 — ertugrul_browser_agent</div>
    </div>
  </div>

  <div class="status-row">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">جاري الاتصال بـ Service Worker...</span>
  </div>

  <div class="info-grid">
    <div class="info-cell">
      <div class="info-label">تبويب الوكيل</div>
      <div class="info-value" id="agentTab">—</div>
    </div>
    <div class="info-cell">
      <div class="info-label">مهام جارية</div>
      <div class="info-value" id="inFlight">0</div>
    </div>
    <div class="info-cell">
      <div class="info-label">الخادم</div>
      <div class="info-value" id="baseUrl" style="font-size:0.72rem;">—</div>
    </div>
    <div class="info-cell">
      <div class="info-label">الحالة</div>
      <div class="info-value" id="swState">—</div>
    </div>
  </div>

  <div class="actions">
    <a href="dashboard.html" target="_blank" class="btn btn-primary">🖥️ فتح لوحة التحكم</a>
    <button class="btn btn-success" id="forcePollBtn">⚡ تشغيل Poll الآن</button>
    <button class="btn btn-muted"   id="refreshBtn">🔄 تحديث الحالة</button>
  </div>

  <div class="footer">Nexus AI Ecosystem — Hedra Souly</div>

  <script src="popup.js"></script>
</body>
</html>
